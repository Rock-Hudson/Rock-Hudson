<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>r avellarmillas | Guitarra Brutal</title>
    
    <!-- Google Fonts: Oswald e Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS para o visual brutal e limpo -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Swiper.js CSS para o Slider inovador -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!-- React e Babel (para rodar JSX direto no navegador sem complicação) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Ajustes finos de estilo que o Tailwind precisa complementar */
        body {
            background-color: #000000;
            font-family: 'Inter', sans-serif;
        }
        .font-oswald {
            font-family: 'Oswald', sans-serif;
        }
        /* Swiper custom */
        .swiper-slide {
            width: 300px;
            height: 400px;
            transition: 0.5s;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #ff003c; }
    </style>
</head>
<body class="bg-black text-white selection:bg-[#ff003c] selection:text-white overflow-x-hidden scroll-smooth">

    <!-- O React vai renderizar o site inteiro aqui dentro -->
    <div id="root"></div>

    <!-- Código do Site em React/JSX -->
    <script type="text/babel">
        function App() {
            // Inicializa o carrossel do Swiper depois que o componente carrega
            React.useEffect(() => {
                new Swiper(".mySwiper", {
                    effect: "coverflow",
                    grabCursor: true,
                    centeredSlides: true,
                    slidesPerView: "auto",
                    loop: true,
                    autoplay: {
                        delay: 3000,
                        disableOnInteraction: false,
                    },
                    coverflowEffect: {
                        rotate: 30,
                        stretch: 0,
                        depth: 100,
                        modifier: 1,
                        slideShadows: false,
                    },
                    pagination: {
                        el: ".swiper-pagination",
                        clickable: true,
                    },
                });
            }, []);

            return (
                <div>
                    {/* HEADER / NAVIGATION */}
                    <header className="fixed top-0 w-full z-50 bg-black/85 backdrop-blur-md border-b border-[#1a1a1a]">
                        <div className="max-w-6xl mx-auto flex justify-between items-center p-5">
                            <div className="font-oswald text-2xl font-bold tracking-wider uppercase">
                                r avellar<span className="text-[#ff003c]">millas</span>
                            </div>
                            <nav className="hidden md:flex space-x-8 font-oswald text-lg uppercase tracking-wide">
                                <a href="#hero" className="hover:text-[#ff003c] transition-colors">Início</a>
                                <a href="#shows" className="hover:text-[#ff003c] transition-colors">Shows</a>
                                <a href="#curso" className="hover:text-[#ff003c] transition-colors">Curso & Harmonia</a>
                                <a href="#aulas" className="hover:text-[#ff003c] transition-colors">Aulas</a>
                            </nav>
                        </div>
                    </header>

                    {/* HERO SECTION */}
                    <section id="hero" className="min-h-screen max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 items-center px-5 pt-24 lg:pt-0 gap-10">
                        <div className="z-10 space-y-6">
                            <h1 className="font-oswald text-6xl md:text-7xl font-bold tracking-tighter uppercase leading-none">
                                R AVELLARMILLAS<br />
                                <span className="text-[#ff003c] drop-shadow-[0_0_15px_rgba(255,0,60,0.4)]">GUITARRA BRUTAL</span>
                            </h1>
                            <p className="text-gray-400 text-lg md:text-xl max-w-lg leading-relaxed">
                                Dominando a fusão entre a brutalidade do metal e a sofisticação da harmonia teórica. Entre para o time e transforme sua técnica de uma vez por todas.
                            </p>
                            <div>
                                <a href="#aulas" className="inline-block border-2 border-[#ff003c] px-10 py-4 font-oswald text-lg uppercase tracking-widest hover:bg-[#ff003c] hover:shadow-[0_0_25px_#ff003c] transition-all duration-300 hover:-translate-y-0.5">
                                    Garantir Minha Vaga
                                </a>
                            </div>
                        </div>

                        {/* Imagem da Direita */}
                        <div className="flex justify-center items-center h-full z-0 group">
                            <div className="relative w-full max-w-md lg:max-w-full">
                                <img 
                                    src="src\images\IMG_7164.JPG" 
                                    alt="tocando guitarra" 
                                    className="w-full max-h-[80vh] object-contain filter grayscale contrast-115 group-hover:grayscale-0 group-hover:contrast-100 transition-all duration-700"
                                />
                            </div>
                        </div>
                    </section>

                    {/* SHOWS SECTION */}
                    <section id="shows" className="py-24 max-w-6xl mx-auto px-5">
                        <h2 className="font-oswald text-5xl uppercase tracking-wide border-l-4 border-[#ff003c] pl-4 mb-16">
                            Estrada & Palcos
                        </h2>
                        
                        <div className="swiper mySwiper w-full py-10">
                            <div className="swiper-wrapper">
                                <div className="swiper-slide border border-[#1a1a1a] filter grayscale contrast-125 [.swiper-slide-active_&]:border-[#ff003c] [.swiper-slide-active_&]:shadow-[0_0_30px_rgba(255,0,60,0.3)] [.swiper-slide-active_&]:grayscale-0">
                                    <img src="show1.jpg" alt="Show 1" className="w-full h-full object-cover" />
                                </div>
                                <div className="swiper-slide border border-[#1a1a1a] filter grayscale contrast-125 [.swiper-slide-active_&]:border-[#ff003c] [.swiper-slide-active_&]:shadow-[0_0_30px_rgba(255,0,60,0.3)] [.swiper-slide-active_&]:grayscale-0">
                                    <img src="show2.jpg" alt="Show 2" className="w-full h-full object-cover" />
                                </div>
                                <div className="swiper-slide border border-[#1a1a1a] filter grayscale contrast-125 [.swiper-slide-active_&]:border-[#ff003c] [.swiper-slide-active_&]:shadow-[0_0_30px_rgba(255,0,60,0.3)] [.swiper-slide-active_&]:grayscale-0">
                                    <img src="show3.jpg" alt="Show 3" className="w-full h-full object-cover" />
                                </div>
                                <div className="swiper-slide border border-[#1a1a1a] filter grayscale contrast-125 [.swiper-slide-active_&]:border-[#ff003c] [.swiper-slide-active_&]:shadow-[0_0_30px_rgba(255,0,60,0.3)] [.swiper-slide-active_&]:grayscale-0">
                                    <img src="show4.jpg" alt="Show 4" className="w-full h-full object-cover" />
                                </div>
                                <div className="swiper-slide border border-[#1a1a1a] filter grayscale contrast-125 [.swiper-slide-active_&]:border-[#ff003c] [.swiper-slide-active_&]:shadow-[0_0_30px_rgba(255,0,60,0.3)] [.swiper-slide-active_&]:grayscale-0">
                                    <img src="show5.jpg" alt="Show 5" className="w-full h-full object-cover" />
                                </div>
                            </div>
                            <div className="swiper-pagination"></div>
                        </div>
                    </section>

                    {/* CURSO BÁSICO & HARMONIA */}
                    <section id="curso" className="py-24 max-w-6xl mx-auto px-5">
                        <h2 className="font-oswald text-5xl uppercase tracking-wide border-l-4 border-[#ff003c] pl-4 mb-16">
                            Curso de Guitarra & Harmonia
                        </h2>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                            {[
                                { id: "01", title: "Mecânica & Precisão", desc: "Postura, sincronia de palhetada alternada, economia de movimentos e aquecimentos brutais." },
                                { id: "02", title: "Intervalos & Acordes", desc: "Desmistificando a teoria musical do zero. Entenda as notas e domine a formação de acordes." },
                                { id: "03", title: "Escalas & Aplicação", desc: "Escala maior, menor, pentatônica e os Modos Gregos aplicados diretamente em riffs e solos." },
                                { id: "04", title: "Rítmica & Drop Tunings", desc: "O segredo do peso. Técnicas de palm muting, subdivisões complexas e afinações baixas." }
                            ].map((modulo) => (
                                <div key={modulo.id} className="bg-[#0a0a0a] border border-[#1a1a1a] p-8 relative overflow-hidden group hover:border-[#ff003c]/30 hover:-translate-y-1 transition-all duration-300">
                                    <div className="font-oswald text-5xl text-[#ff003c]/10 absolute top-4 right-6 group-hover:text-[#ff003c]/20 transition-colors duration-300">
                                        {modulo.id}
                                    </div>
                                    <h3 className="font-oswald text-xl uppercase tracking-wider mb-4 relative z-10">
                                        {modulo.title}
                                    </h3>
                                    <p className="text-gray-400 text-sm leading-relaxed relative z-10">
                                        {modulo.desc}
                                    </p>
                                    <div className="absolute left-0 top-0 w-[4px] h-full bg-[#ff003c] scale-y-0 group-hover:scale-y-100 transition-transform duration-300 origin-top" />
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* CONTACT / AULAS */}
                    <section id="aulas" className="py-24 max-w-6xl mx-auto px-5">
                        <h2 className="font-oswald text-5xl uppercase tracking-wide border-l-4 border-[#ff003c] pl-4 mb-16">
                            Evolua Seu Som
                        </h2>
                        
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                            <div className="space-y-6 text-gray-400 text-lg leading-relaxed">
                                <p>Quer levar sua técnica para o próximo nível? Estou abrindo vagas para mentorias e aulas de guitarra personalizadas, presenciais ou online.</p>
                                <p>Seja você um iniciante querendo entender o básico ou um guitarrista de metal querendo fritar na harmonia e na velocidade, eu montei o método certo.</p>
                                <div className="font-oswald text-2xl text-[#ff003c] tracking-wider font-bold">
                                    VAGAS LIMITADAS.
                                </div>
                            </div>
                            
                            <div>
                                <form onSubmit={(e) => e.preventDefault()} className="flex flex-col space-y-5">
                                    <input type="text" placeholder="Seu Nome completo" required className="bg-[#0a0a0a] border border-[#1a1a1a] p-4 text-white focus:outline-none focus:border-[#ff003c] transition-colors" />
                                    <input type="email" placeholder="Seu melhor E-mail" required className="bg-[#0a0a0a] border border-[#1a1a1a] p-4 text-white focus:outline-none focus:border-[#ff003c] transition-colors" />
                                    <textarea rows="5" placeholder="Fale um pouco sobre seu nível atual e seus objetivos na guitarra" required className="bg-[#0a0a0a] border border-[#1a1a1a] p-4 text-white focus:outline-none focus:border-[#ff003c] transition-colors resize-none" />
                                    <button type="submit" class="w-full border-2 border-[#ff003c] py-4 font-oswald text-lg uppercase tracking-widest hover:bg-[#ff003c] hover:shadow-[0_0_25px_#ff003c] transition-all duration-300">
                                        Enviar Mensagem
                                    </button>
                                </form>
                            </div>
                        </div>
                    </section>

                    {/* FOOTER */}
                    <footer className="text-center py-10 border-t border-[#1a1a1a] text-gray-500 text-sm">
                        <p>&copy; 2026 r avellarmillas. Todos os direitos reservados. Powered by React & Tailwind.</p>
                    </footer>
                </div>
            );
        }

        // Renderiza o componente principal na tela
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- JS do Swiper Carrossel -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</body>
</html>
